<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Warning - PhishGuard</title>
    <link rel="stylesheet" href="warning.css">
</head>
<body>
    <div class="warning-container">
        <div class="icon-header">
            <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <h1 id="warning-title">Deceptive site ahead</h1>
        </div>
        
        <p class="description">
            Attackers on <strong id="url-display">this site</strong> may trick you into doing something dangerous like installing software or revealing your personal information (for example, passwords, phone numbers, or credit cards).
        </p>
        
        <div class="card">
            <div class="card-header">
                <h2>Risk Assessment</h2>
                <span id="severity-badge" class="badge">UNKNOWN</span>
            </div>
            
            <div class="score-container">
                <div class="score-ring">
                    <svg viewBox="0 0 36 36" class="circular-chart">
                        <path class="circle-bg"
                            d="M18 2.0845
                            a 15.9155 15.9155 0 0 1 0 31.831
                            a 15.9155 15.9155 0 0 1 0 -31.831"
                        />
                        <path class="circle" id="score-circle"
                            stroke-dasharray="0, 100"
                            d="M18 2.0845
                            a 15.9155 15.9155 0 0 1 0 31.831
                            a 15.9155 15.9155 0 0 1 0 -31.831"
                        />
                        <text x="18" y="20.35" class="percentage" id="score-text">0</text>
                    </svg>
                </div>
                <div class="score-label">Risk Score<br><span id="action-label" class="sub-label">Recommended Action</span></div>
            </div>

            <div class="reasons-box">
                <h3>Detection Reasons:</h3>
                <ul id="reasons-list">
                    <!-- Reasons injected here -->
                </ul>
            </div>
        </div>
        
        <div class="actions">
            <button id="btn-back" class="btn btn-primary">Back to safety</button>
            <button id="btn-continue" class="btn btn-ghost">Continue anyway (unsafe)</button>
        </div>
    </div>
    <script src="warning.js"></script>
</body>
</html>
