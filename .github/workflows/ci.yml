name: Main CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"
    - name: Install Linting & Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pip-audit
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 app.py detector/ tests/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 app.py detector/ tests/ scripts/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run pip-audit
      run: |
        pip-audit -r requirements.txt || echo "pip-audit found vulnerabilities, but continuing for now."

  test:
    runs-on: ubuntu-latest
    needs: lint-and-security
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    - name: Run tests
      run: |
        # Run all test suites
        pytest tests/ -v
